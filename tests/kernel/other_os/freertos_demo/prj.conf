CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048
# configTICK_RATE_HZ, configMAX_PRIORITIES and time slicing of equal
# priorities at every tick, as in the demo's FreeRTOSConfig.h
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_NUM_PREEMPT_PRIORITIES=7
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_EVENTS=y
